[project]
name = "doom-foxglove"
version = "0.1.0"
description = "ViZDoom as a fake robot on a Foxglove SDK WebSocket"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "foxglove-sdk>=0.10",
  "pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
vizdoom = ["vizdoom"]

[project.scripts]
doom-foxglove = "doom_foxglove.server:main"
doom-foxglove-smoke = "doom_foxglove.smoke:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doom_foxglove*"]
